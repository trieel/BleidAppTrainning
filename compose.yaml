services:
  db:
    image: postgres:16
    container_name: bleid-db
    environment:
      POSTGRES_DB: bleidapp
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - bleid-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d bleidapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bleid-data:
