name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-api:
    name: Build & Test .NET API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore bleid-api/BleidAppTraining.sln

      - name: Build solution
        run: dotnet build bleid-api/BleidAppTraining.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test bleid-api/BleidAppTraining.sln -c Release --no-build --verbosity normal

  build-web:
    name: Build & Lint Next.js PWA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: bleid-web/package-lock.json

      - name: Install dependencies
        working-directory: bleid-web
        run: npm ci

      - name: Run ESLint
        working-directory: bleid-web
        run: npm run lint

      - name: Build Next.js application
        working-directory: bleid-web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

  docker-api:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: test-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t bleid-api:ci -f bleid-api/Dockerfile bleid-api
